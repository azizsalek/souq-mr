<!doctype html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0d6357"><title>تسجيل الدخول | Souq MR</title><link rel="stylesheet" href="portal.css"></head><body><main class="auth-page"><section class="auth-aside"><a class="brand" href="index.html" style="color:white">Souq <b>MR</b></a><h1>أهلاً بك<br>في سوق موريتانيا.</h1><p>سجّل الدخول لإدارة طلباتك وإعلاناتك ومتابعة تجربتك في Souq MR.</p><div>🇲🇷　السوق المحلي بين يديك</div></section><section class="auth-box-wrap"><div class="auth-box"><span class="muted">حساب Souq MR</span><h2 id="formTitle">تسجيل الدخول</h2><p class="muted" id="formNote">أدخل بريدك الإلكتروني وكلمة المرور للمتابعة.</p><form id="authForm"><label id="nameWrap" class="hidden">الاسم الكامل<input name="name" autocomplete="name"></label><label>البريد الإلكتروني<input name="email" type="email" required autocomplete="email" placeholder="name@example.com"></label><label id="phoneWrap" class="hidden">رقم الهاتف<input name="phone" type="tel"></label><label id="cityWrap" class="hidden">المدينة<select name="city"><option>نواكشوط</option><option>نواذيبو</option><option>روصو</option><option>كيفه</option><option>أطار</option></select></label><label>كلمة المرور<input name="password" type="password" minlength="6" required autocomplete="current-password" placeholder="كلمة المرور"></label><label id="roleWrap" class="hidden">نوع الحساب<select name="role"><option value="buyer">مشتري</option><option value="seller">بائع</option></select></label><button class="btn" id="submitBtn">تسجيل الدخول</button></form><p class="auth-switch" id="switchLine">ليس لديك حساب؟ <a href="#" id="switchMode">إنشاء حساب جديد</a></p><p class="muted" id="feedback" role="status"></p><p class="auth-switch"><a href="index.html">العودة إلى الصفحة الرئيسية</a></p></div></section></main><script type="module" src="login.js"></script></body></html>
